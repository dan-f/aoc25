[project]
name = "aocli"
version = "0.1.0"
description = "CLI orchestration for python solutions to Advent of Code"
readme = "README.md"
authors = [{ name = "Daniel Friedman", email = "dfriedman58@gmail.com" }]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
aocli = "aocli:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "ruff>=0.14.9",
]

[tool.mypy]
strict = true

[tool.ruff.lint]
extend-select = ["I"]
